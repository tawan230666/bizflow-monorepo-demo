# BizFlow — local development stack
#
#   docker compose up --build
#
#   Customer ordering app  → http://localhost:3003
#   Staff console          → http://localhost:4000   (admin / admin123)
#   REST + Socket.IO API   → http://localhost:5000/api/health
#
# Credentials below are for local development only.

services:
  mysql-db:
    image: mysql:8.0
    container_name: bizflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bizflow_db}
      MYSQL_USER: ${MYSQL_USER:-bizflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bizflow123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bizflow-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass123}"]
      interval: 10s
      retries: 10
      start_period: 30s

  api-server:
    build:
      context: ./apps/api-server
    container_name: bizflow-api
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-bizflow}:${MYSQL_PASSWORD:-bizflow123}@mysql-db:3306/${MYSQL_DATABASE:-bizflow_db}"
      PORT: 5000
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me}
      CORS_ORIGIN: "http://localhost:3003,http://localhost:4000"
      PROMPTPAY_ID: ${PROMPTPAY_ID:-0812345678}
    ports:
      - "5000:5000"
    volumes:
      - ./apps/api-server/src:/app/src
      - ./apps/api-server/prisma:/app/prisma
    networks:
      - bizflow-net
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run dev"

  customer-app:
    build:
      context: ./apps/customer-app
    container_name: bizflow-customer
    restart: unless-stopped
    depends_on:
      - api-server
    environment:
      VITE_API_URL: "http://localhost:5000/api"
      VITE_SOCKET_URL: "http://localhost:5000"
    ports:
      - "3003:3003"
    volumes:
      - ./apps/customer-app/src:/app/src
    networks:
      - bizflow-net

  staff-console:
    build:
      context: ./apps/staff-console
    container_name: bizflow-staff
    restart: unless-stopped
    depends_on:
      - api-server
    environment:
      VITE_API_URL: "http://localhost:5000/api"
      VITE_SOCKET_URL: "http://localhost:5000"
    ports:
      - "4000:4000"
    volumes:
      - ./apps/staff-console/src:/app/src
    networks:
      - bizflow-net

volumes:
  mysql_data:

networks:
  bizflow-net:
    driver: bridge
